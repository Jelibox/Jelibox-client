name: Release

# Runs when a version tag is pushed (git push origin v0.4.0). See RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow numpy opencv-python-headless
      - name: Tag must match utils.__version__
        run: python tools/release.py --check-tag "$GITHUB_REF_NAME"
      - name: Repo + unit checks
        run: python tests/run.py --only repo,unit
      - name: Release notes from CHANGELOG.md
        run: python tools/release.py --notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Jelibox $GITHUB_REF_NAME" --notes-file release-notes.md $flags
